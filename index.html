<style>
  :root{
    --amber:#f59e0b; --orange:#f97316;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1100px 560px at 78% -12%, rgba(245,158,11,.10), transparent 60%),
      radial-gradient(900px 520px at -8% 6%, rgba(99,102,241,.07), transparent 55%),
      #09090b;
    background-attachment:fixed;
    min-height:100vh;
  }
  ::selection{ background:rgba(245,158,11,.28); }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#27272a;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#3f3f46;background-clip:content-box}

  /* ---- pointers & focus (a11y) ---- */
  button:not(:disabled), [role="button"], a, label, select{ cursor:pointer; }
  :focus-visible{ outline:2px solid rgba(245,158,11,.65); outline-offset:2px; border-radius:10px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:none; }

  /* ---- refined card surface ---- */
  .glow{
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 14px 40px -18px rgba(0,0,0,.85);
    border:1px solid rgba(255,255,255,.06);
    transition:box-shadow .28s var(--ease-out), border-color .28s var(--ease-out), background-color .25s;
  }
  .glow:hover{
    border-color:rgba(245,158,11,.20);
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 24px 58px -20px rgba(0,0,0,.95);
  }
  /* small clickable cards get a subtle lift */
  .lift{ transition:transform .22s var(--ease-out), background-color .22s, box-shadow .22s; }
  .lift:hover{ transform:translateY(-2px); box-shadow:0 18px 40px -22px rgba(0,0,0,.9); }

  /* ---- tactile press feedback ---- */
  button, a.btn, .pressable{ transition:transform .12s var(--ease-spring), background-color .2s, color .2s, border-color .2s, opacity .2s; }
  button:not(:disabled):active{ transform:scale(.96); }

  /* ---- entrance: staggered fade-up of view content ---- */
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  @keyframes popIn{ 0%{opacity:0; transform:scale(.6)} 100%{opacity:1; transform:scale(1)} }
  .view-enter > * > *{ animation:fadeUp .5s var(--ease-out) both; }
  .view-enter > * > *:nth-child(1){animation-delay:.02s}
  .view-enter > * > *:nth-child(2){animation-delay:.06s}
  .view-enter > * > *:nth-child(3){animation-delay:.10s}
  .view-enter > * > *:nth-child(4){animation-delay:.14s}
  .view-enter > * > *:nth-child(5){animation-delay:.18s}
  .view-enter > * > *:nth-child(6){animation-delay:.22s}
  .view-enter > * > *:nth-child(7){animation-delay:.26s}
  .view-enter > * > *:nth-child(8){animation-delay:.30s}
  .view-enter > * > *:nth-child(n+9){animation-delay:.34s}

  /* ---- progress bars fill smoothly ---- */
  .bar-fill{ transition:width .7s var(--ease-out); }

  /* ---- sidebar active indicator ---- */
  .nav-item{ position:relative; }
  .nav-active::before{
    content:""; position:absolute; left:-4px; top:50%; transform:translateY(-50%);
    width:3px; height:58%; border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--amber),var(--orange));
    box-shadow:0 0 12px rgba(245,158,11,.55);
  }

  /* ---- habit cell check pop ---- */
  .cell-on{ animation:popIn .26s var(--ease-spring); }

  /* ---- countdown hover/tap popover ---- */
  .cd-pop{ opacity:0; pointer-events:none; transform:translateY(-6px) scale(.98); transform-origin:top left;
    transition:opacity .2s var(--ease-out), transform .2s var(--ease-out); }
  .cd-card:hover .cd-pop, .cd-card.cd-open .cd-pop{ opacity:1; pointer-events:auto; transform:none; }
  .cd-card:hover{ z-index:30; }
  .bt-pop{ opacity:0; pointer-events:none; transform:translateY(-6px); transition:opacity .2s var(--ease-out), transform .2s var(--ease-out); }
  .bt-wrap:hover .bt-pop, .bt-wrap:focus-within .bt-pop{ opacity:1; pointer-events:auto; transform:none; }

  /* ---- emoji grow on hover (überall) ---- */
  .emo{ display:inline-block; transition:transform .2s var(--ease-out); transform-origin:center; }
  .emo:hover, button:hover > .emo, a:hover .emo, .lift:hover .emo, .group:hover .emo{ transform:scale(1.45); }

  /* ---- Intro (Background Paths) ---- */
  @keyframes introFade{ from{opacity:0} to{opacity:1} }
  @keyframes riseIn{ from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:none} }
  @keyframes letterFade{ from{opacity:0} to{opacity:1} }
  @keyframes fpDash{ from{stroke-dashoffset:0} to{stroke-dashoffset:-1} }
  @keyframes fpPulse{ 0%,100%{opacity:.3} 50%{opacity:.6} }
  .fp{ stroke-dasharray:.7 .3; animation:fpDash var(--dur,24s) linear infinite; opacity:.55; }
  .rise-in{ animation:riseIn .9s cubic-bezier(.22,1,.36,1) both; }
  .letter-fade{ animation:letterFade .7s ease-out both; }

  /* ---- Streak-Celebration ---- */
  @keyframes stickerPop{ 0%{transform:scale(0) rotate(-14deg); opacity:0} 60%{transform:scale(1.25) rotate(5deg); opacity:1} 100%{transform:scale(1) rotate(0)} }
  @keyframes flamePop{ 0%{transform:scale(0); opacity:0} 70%{transform:scale(1.35)} 100%{transform:scale(1); opacity:1} }
  @keyframes flameWob{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.22) rotate(6deg)} }

  /* ---- running timer gentle pulse ---- */
  @keyframes pulseGlow{ 0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.40)} 50%{box-shadow:0 0 0 7px rgba(245,158,11,0)} }
  .timer-pulse{ animation:pulseGlow 2.4s ease-in-out infinite; }

  /* ---- respect reduced motion ---- */
  @media (prefers-reduced-motion: reduce){
    *, .view-enter > * > *, .glow, .lift, .timer-pulse, .cell-on{
      animation:none !important; transition:none !important; scroll-behavior:auto !important;
    }
    .lift:hover, .glow:hover{ transform:none !important; }
    .emo, .emo:hover, button:hover > .emo, a:hover .emo, .lift:hover .emo, .group:hover .emo{ transform:none !important; }
  }
  .fire-glow{box-shadow:0 0 10px rgba(245,158,11,.45)}
  .ice-glow{box-shadow:0 0 12px rgba(56,189,248,.6)}
</style>
</head>
<body class="text-zinc-200">
<div id="root"></div>
<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const todayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekKey(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const yStart=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil((((t-yStart)/86400000)+1)/7);
  return `${t.getUTCFullYear()}-W${pad(wk)}`;
}
const fmtDur = s => { s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0?`${h}h ${pad(m)}m`:`${m}m ${pad(s%60)}s`; };
const fmtHrs = s => (s/3600).toFixed(1).replace('.0','')+'h';
function greeting(){ const h=new Date().getHours(); return h<5?'Gute Nacht':h<11?'Guten Morgen':h<17?'Servus':h<22?'Guten Abend':'Spät noch wach'; }
const uid = () => Math.random().toString(36).slice(2,9);
const addDaysKey = n => { const d=new Date(); d.setDate(d.getDate()+n); return todayKey(d); };
const daysUntil = dateStr => { const t=new Date(dateStr+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); };
const workdaysUntil = dateStr => { const t=new Date(dateStr+'T00:00:00'); const d=new Date(); d.setHours(0,0,0,0); if(t<=d) return 0; let c=0; while(d<t){ d.setDate(d.getDate()+1); const wd=d.getDay(); if(wd!==0&&wd!==6) c++; } return c; };
const fmtTargetDate = dateStr => new Date(dateStr+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const de1 = x => x.toFixed(1).replace('.',',');
function logDoneTodo(d, text, proj){ const tk=todayKey(); if(!d.doneLog)d.doneLog={}; if(!d.doneLog[tk])d.doneLog[tk]=[]; const norm=e=>typeof e==='string'?e:e.text; if(!d.doneLog[tk].some(e=>norm(e)===text)) d.doneLog[tk].unshift({text, auto:true, emoji:proj&&proj.emoji, pid:proj&&proj.id}); }
function unlogDoneTodo(d, text){ const tk=todayKey(); if(d.doneLog&&d.doneLog[tk]) d.doneLog[tk]=d.doneLog[tk].filter(e=>!(e&&typeof e==='object'&&e.auto&&e.text===text)); }
function projActive(d,p,k){
  if(p.days && p.days[k]>0) return true;
  return (((d.doneLog||{})[k])||[]).some(e=>e&&typeof e==='object'&&(e.pid===p.id||(e.auto&&e.emoji===p.emoji)));
}
function projStreak(d,p){
  const dt=new Date(); let s=0;
  if(!projActive(d,p,todayKey(dt))) dt.setDate(dt.getDate()-1);
  for(;;){ if(projActive(d,p,todayKey(dt))){ s++; dt.setDate(dt.getDate()-1); } else break; }
  return s;
}
function projStreakAfterCheck(d,p){ let s=1; const dt=new Date(); for(;;){ dt.setDate(dt.getDate()-1); if(projActive(d,p,todayKey(dt))) s++; else break; } return s; }
const weekDayKeys = (ref=new Date()) => { const mon=new Date(ref); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); return [...Array(7)].map((_,i)=>{ const x=new Date(mon); x.setDate(mon.getDate()+i); return todayKey(x); }); };
const projDay = (p,dk) => (p.days&&p.days[dk])||0;
const projWeek = p => { const wk=weekKey(); const legacy=(p.time&&p.time[wk])||0; return legacy + weekDayKeys().reduce((s,dk)=>s+projDay(p,dk),0); };
const areaWeekSecs = (projects,area) => projects.filter(p=>p.area===area).reduce((s,p)=>s+projWeek(p),0);
const areaDaySecs = (projects,area,dk) => projects.filter(p=>p.area===area).reduce((s,p)=>s+projDay(p,dk),0);
const goalH = (data,area,kind) => (data.goals&&data.goals[area]&&data.goals[area][kind])||0;
function ensureGoals(d){ if(!d.goals)d.goals={}; if(!d.goals.uni)d.goals.uni={day:4,week:20}; if(!d.goals.sidehustle)d.goals.sidehustle={day:2,week:12}; if(!d.goals.leben)d.goals.leben={day:1,week:6}; if(!d.goals.screen)d.goals.screen={week:14,day:2}; if(d.goals.screen.day==null)d.goals.screen.day=2; if(d.goals.screen.week==null)d.goals.screen.week=14; }
const daysSince = ts => ts ? (Date.now()-ts)/86400000 : Infinity;
function prioOrderedIds(d){
  const all=(d.projects||[]).flatMap(p=>p.todos.filter(t=>!t.done&&(t.prio||0)>0).map(t=>t.id));
  const order=Array.isArray(d.prioOrder)?d.prioOrder:[];
  const idx=id=>{const i=order.indexOf(id);return i<0?1e9:i;};
  const prioOf=id=>{ for(const p of d.projects){ const t=p.todos.find(x=>x.id===id); if(t) return t.prio||0; } return 0; };
  return all.sort((a,b)=>{ const oa=idx(a),ob=idx(b); if(oa!==ob)return oa-ob; return prioOf(b)-prioOf(a); });
}
function quickOrderedIds(d){
  const all=(d.projects||[]).flatMap(p=>p.todos.filter(t=>!t.done).map(t=>({id:t.id,mins:t.mins||0})));
  const order=Array.isArray(d.quickOrder)?d.quickOrder:[];
  const idx=id=>{const i=order.indexOf(id);return i<0?1e9:i;};
  return all.sort((a,b)=>{ const oa=idx(a.id),ob=idx(b.id); if(oa!==ob)return oa-ob; return a.mins-b.mins; }).map(x=>x.id);
}
const collectLinks = data => { const out=[];
  (data.helpfulLinks||[]).forEach(l=>out.push({url:lUrl(l),label:lLabel(l),src:'Tools & Seiten',cat:'tools'}));
  (data.projects||[]).forEach(p=>{ (p.links||[]).forEach(l=>out.push({url:lUrl(l),label:lLabel(l),src:`${p.emoji} ${p.name}`,cat:p.area}));
    (p.todos||[]).forEach(t=>(t.links||[]).forEach(u=>out.push({url:lUrl(u),label:lLabel(u),src:`${p.emoji} ${p.name} · ✓ ${t.text.slice(0,28)}`,cat:p.area}))); });
  (data.habits||[]).forEach(h=>(h.links||[]).forEach(l=>out.push({url:lUrl(l),label:lLabel(l),src:`${h.emoji||'✅'} ${h.name}`,cat:'habits'})));
  (data.ideas||[]).forEach(i=>(i.links||[]).forEach(l=>out.push({url:lUrl(l),label:lLabel(l),src:`${i.emoji||'💡'} ${i.name}`,cat:'ideen'})));
  return out.filter(x=>x.url); };
const incomeWeek = (data, dayKeys) => (data.projects||[]).filter(p=>p.area==='sidehustle').reduce((s,p)=>s+(p.income||[]).filter(e=>dayKeys.indexOf(e.date)>=0).reduce((a,e)=>a+(+e.amount||0),0),0);
const incomeMonth = (data, ym) => (data.projects||[]).filter(p=>p.area==='sidehustle').reduce((s,p)=>s+(p.income||[]).filter(e=>(e.date||'').slice(0,7)===ym).reduce((a,e)=>a+(+e.amount||0),0),0);
const lUrl = l => typeof l==='string' ? l : ((l&&l.url)||'');
const lLabel = l => { const u=lUrl(l); const lab=(l&&typeof l==='object') ? l.label : ''; return lab || u.replace(/^https?:\/\//,'').replace(/\/$/,''); };

/* ---------- Seed-Daten (aus deinen Canvases) ---------- */
const SEED = {
  sleep: {},
  habits: [],
  projects: [],
  ideas: [],
  activeTimer: null,
  inbox: [],
  helpfulLinks: [
    {label:'Claude',url:'https://claude.ai'},
    {label:'Perplexity',url:'https://www.perplexity.ai'},
    {label:'NotebookLM',url:'https://notebooklm.google.com'},
  ],
};

/* Vorbelegungen entfernt — KEINE persoenlichen Daten im Quelltext (Datei ist public-safe). Echte Daten kommen per Gist-Sync oder Backup-Import. */
const IDEA_DETAILS = {};
const PROJECT_TOOLS = {};
const IDEA_CANVAS_LINKS = {};

function loadData(){
  let d;
  try{ const v=localStorage.getItem('lifeos.v5'); if(v){ d=JSON.parse(v); if(!d.ideas||!d.ideas.length) d.ideas=SEED.ideas; if(!d.projects||!d.projects.length) d.projects=SEED.projects; if(!d.habits||!d.habits.length) d.habits=SEED.habits; if(!d.inbox) d.inbox=[]; if(!d.helpfulLinks) d.helpfulLinks=SEED.helpfulLinks; } }catch(e){}
  if(!d) d=SEED;
  (d.ideas||[]).forEach(idea=>{ const det=IDEA_DETAILS[idea.name]; if(det){ if(!idea.note&&det.note) idea.note=det.note; if((!idea.links||!idea.links.length)&&det.links&&det.links.length) idea.links=det.links; } });
  (d.ideas||[]).forEach(idea=>{ const cl=IDEA_CANVAS_LINKS[idea.name]; if(cl&&cl.length&&!idea._clMerged){ idea.links=[...new Set([...(idea.links||[]),...cl])]; idea._clMerged=true; } });
  (d.projects||[]).forEach(p=>{ const t=PROJECT_TOOLS[p.name]; if(t && (!p.tools||!p.tools.length)) p.tools=t; });
  if(!Array.isArray(d.habitOrder)) d.habitOrder=[];
  { const ids=(d.habits||[]).map(h=>h.id); d.habitOrder=d.habitOrder.filter(id=>ids.indexOf(id)>=0); ids.forEach(id=>{ if(d.habitOrder.indexOf(id)<0) d.habitOrder.push(id); }); }
  if(!Array.isArray(d.countdowns)) d.countdowns=[];
  if(!d.bigThing || typeof d.bigThing!=='object' || Array.isArray(d.bigThing)) d.bigThing={};
  if(!d.doneLog || typeof d.doneLog!=='object' || Array.isArray(d.doneLog)) d.doneLog={};
  if(!d.screenTime || typeof d.screenTime!=='object' || Array.isArray(d.screenTime)) d.screenTime={};
  if(!d.ui || typeof d.ui!=='object') d.ui={};
  if(!d.ui.collapsed || typeof d.ui.collapsed!=='object') d.ui.collapsed={};
  ensureGoals(d);
  (d.projects||[]).forEach(p=>{ if(!p.days||typeof p.days!=='object') p.days={}; });
  return d;
}

/* ---------- UI-Bausteine ---------- */
function Card({children, className=''}){
  return <div className={`bg-zinc-900/70 rounded-2xl p-5 glow ${className}`}>{children}</div>;
}
function Bar({value}){
  return <div className="h-2 bg-zinc-800/80 rounded-full overflow-hidden">
    <div className="bar-fill h-full rounded-full bg-gradient-to-r from-amber-500 to-orange-500" style={{width:`${value}%`}}/>
  </div>;
}

/* ---------- App ---------- */
/* ---------- Gist-Sync ---------- */
const SYNC_KEY='lifeos.sync';
const loadSyncCfg=()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){ return null; } };
const saveSyncCfg=c=>{ try{ if(c) localStorage.setItem(SYNC_KEY,JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} };
async function gistPull(cfg){
  const r=await fetch('https://api.github.com/gists/'+cfg.gistId,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
  if(!r.ok) throw new Error('GitHub '+r.status+(r.status===401?' (Token falsch?)':r.status===404?' (Gist-ID falsch?)':''));
  const g=await r.json(); const f=g.files&&g.files['lifeos.json'];
  if(!f) return null;
  let content=f.content;
  if(f.truncated && f.raw_url){ const rr=await fetch(f.raw_url); content=await rr.text(); }
  if(!content || !content.trim() || content.trim()==='{}') return null;
  try{ return JSON.parse(content); }catch(e){ throw new Error('Gist-Inhalt ist kein gültiges JSON'); }
}
async function gistPush(cfg,data){
  const r=await fetch('https://api.github.com/gists/'+cfg.gistId,{method:'PATCH',
    headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({files:{'lifeos.json':{content:JSON.stringify(data)}}})});
  if(!r.ok) throw new Error('GitHub '+r.status+(r.status===401?' (Token falsch?)':r.status===404?' (Gist-ID falsch?)':''));
}

function App(){
  const [data,setData]=useState(loadData);
  const [view,setView]=useState('today');
  const [openId,setOpenId]=useState(null);
  const [now,setNow]=useState(Date.now());
  const [capture,setCapture]=useState('');
  const [cheerState,setCheerState]=useState(null);
  const cheer=p=>setCheerState({emoji:(p&&p.emoji)||'⭐', streak:projStreakAfterCheck(data,p), id:uid()});

  /* --- Gist-Sync --- */
  const dataRef=useRef(data); useEffect(()=>{ dataRef.current=data; });
  const [syncCfg,setSyncCfgState]=useState(loadSyncCfg);
  const [syncState,setSyncState]=useState(()=>loadSyncCfg()?{s:'idle',msg:''}:{s:'off',msg:''});
  const [showSync,setShowSync]=useState(false);
  const [mobileMenu,setMobileMenu]=useState(false);
  const skipPush=useRef(false); const syncTimer=useRef(null); const firstData=useRef(true);
  const stamp=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const looksEmpty=x=>!x || !(((x.projects||[]).length)||((x.habits||[]).length)||((x.ideas||[]).length)||Object.keys(x.doneLog||{}).length);
  const fullSync=async cfg=>{
    try{
      setSyncState({s:'syncing',msg:''});
      const remote=await gistPull(cfg);
      const remoteNewer=remote && (remote.updatedAt||0)>(dataRef.current.updatedAt||0);
      if(remoteNewer && !(looksEmpty(remote) && !looksEmpty(dataRef.current))){ skipPush.current=true; setData(remote); }
      else { await gistPush(cfg,dataRef.current); }
      setSyncState({s:'ok',msg:stamp()});
    }catch(e){ setSyncState({s:'error',msg:String(e.message||e)}); }
  };
  useEffect(()=>{ if(syncCfg) fullSync(syncCfg); },[]);
  useEffect(()=>{
    if(firstData.current){ firstData.current=false; return; }
    if(!syncCfg) return;
    if(skipPush.current){ skipPush.current=false; return; }
    clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(async()=>{
      try{ setSyncState({s:'syncing',msg:''}); await gistPush(syncCfg,dataRef.current); setSyncState({s:'ok',msg:stamp()}); }
      catch(e){ setSyncState({s:'error',msg:String(e.message||e)}); }
    },3000);
    return ()=>clearTimeout(syncTimer.current);
  },[data]);
  const syncSave=(token,gistId)=>{ token=(token||'').trim(); gistId=(gistId||'').trim().split(/[?#]/)[0].replace(/\/+$/,'').split('/').pop(); if(!token||!gistId){ setSyncState({s:'error',msg:'Token und Gist-ID nötig'}); return; } const cfg={token,gistId}; saveSyncCfg(cfg); setSyncCfgState(cfg); fullSync(cfg); };
  const syncDisconnect=()=>{ saveSyncCfg(null); setSyncCfgState(null); setSyncState({s:'off',msg:''}); };
  const syncForcePull=async()=>{ if(!syncCfg)return; try{ setSyncState({s:'syncing',msg:''}); const remote=await gistPull(syncCfg); if(remote){ skipPush.current=true; setData(remote); setSyncState({s:'ok',msg:stamp()}); } else setSyncState({s:'error',msg:'Gist ist leer'}); }catch(e){ setSyncState({s:'error',msg:String(e.message||e)}); } };
  const syncForcePush=async()=>{ if(!syncCfg)return; try{ setSyncState({s:'syncing',msg:''}); await gistPush(syncCfg,dataRef.current); setSyncState({s:'ok',msg:stamp()}); }catch(e){ setSyncState({s:'error',msg:String(e.message||e)}); } };
  const syncDot = syncState.s==='off'?null:<span className={"inline-block w-2 h-2 rounded-full shrink-0 "+(syncState.s==='error'?'bg-red-500':syncState.s==='syncing'?'bg-amber-400 animate-pulse':'bg-emerald-500')} title={syncState.s==='error'?syncState.msg:syncState.s}/>;

  useEffect(()=>{ try{ localStorage.setItem('lifeos.v5',JSON.stringify(data)); }catch(e){} },[data]);
  useEffect(()=>{
    if(!data.activeTimer) return;
    const tick=()=>setNow(Date.now());
    const i=setInterval(tick,1000);
    const onVis=()=>{ if(!document.hidden) tick(); };
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('focus',tick);
    return ()=>{ clearInterval(i); document.removeEventListener('visibilitychange',onVis); window.removeEventListener('focus',tick); };
  },[data.activeTimer]);

  const update = fn => setData(d=>{ const c=JSON.parse(JSON.stringify(d)); fn(c); c.updatedAt=Date.now(); return c; });

  const startTimer = pid => update(d=>{
    if(d.activeTimer) stopInto(d);
    d.activeTimer={projectId:pid,startedAt:Date.now()};
  });
  const stopInto = d => {
    if(!d.activeTimer) return;
    const el=(Date.now()-d.activeTimer.startedAt)/1000;
    const p=d.projects.find(x=>x.id===d.activeTimer.projectId);
    if(p){ if(!p.days)p.days={}; const dk=todayKey(); p.days[dk]=(p.days[dk]||0)+el; }
    d.activeTimer=null;
  };
  const stopTimer = () => update(d=>stopInto(d));

  const activeProject = data.activeTimer ? data.projects.find(p=>p.id===data.activeTimer.projectId) : null;
  const runningSecs = data.activeTimer ? (now-data.activeTimer.startedAt)/1000 : 0;

  const nav=[
    ['today','📊','Heute'],['inbox','📥','Inbox'],['uni','🎓','Uni'],['side','🚀','Side-Hustles'],['ideas','💡','Ideen'],['leben','🗂️','Leben'],
    ['habits','✅','Habits'],['sleep','😴','Schlaf'],['streaks','🔥','Streaks'],['links','🔗','Links'],['rueckblick','📅','Rückblick'],
  ];

  const downloadBackup=(snapshot)=>{
    const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`life-os-backup-${todayKey()}.json`; a.click();
  };
  const exportData=()=>{ const now=Date.now(); downloadBackup({...data,lastBackup:now}); update(d=>{d.lastBackup=now;}); };
  // Auto-Backup: einmal pro Woche automatisch herunterladen
  useEffect(()=>{
    if(daysSince(data.lastAutoBackup) < 7) return;
    const t=setTimeout(()=>{ const now=Date.now(); downloadBackup({...data,lastAutoBackup:now,lastBackup:now}); update(d=>{d.lastAutoBackup=now; d.lastBackup=now;}); }, 1800);
    return ()=>clearTimeout(t);
  },[]);
  const importData=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); obj.updatedAt=Date.now(); setData(obj); }catch(x){ alert('Datei nicht lesbar'); } }; r.readAsText(f);
  };

  return <div className="md:flex min-h-screen">

      <form onSubmit={e=>{e.preventDefault();if(capture.trim()){update(d=>{if(!d.inbox)d.inbox=[];d.inbox.unshift({id:uid(),text:capture.trim()});});setCapture('');}}} className="flex-1">

      </form>
      {activeProject && <span className="shrink-0 text-[11px] text-amber-400 tabular-nums">▶ {fmtDur(runningSecs)}</span>}
    </header>
    {/* Sidebar (Desktop/Tablet) */}
    <aside className="hidden md:flex w-60 shrink-0 border-r border-zinc-800/60 bg-zinc-950/40 backdrop-blur-xl p-4 flex-col gap-1 sticky top-0 h-screen">
      <div className="px-2 py-3 mb-1">
        <div className="text-xl font-bold tracking-tight">🎯 Life OS</div>
        <div className="text-xs text-zinc-500">{greeting()}, Miguel</div>
      </div>
      <form onSubmit={e=>{e.preventDefault();if(capture.trim()){update(d=>{if(!d.inbox)d.inbox=[];d.inbox.unshift({id:uid(),text:capture.trim()});});setCapture('');}}} className="px-1 mb-3">
        <input value={capture} onChange={e=>setCapture(e.target.value)} placeholder="📥 Schnell rein…" className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:border-amber-500 outline-none"/>
      </form>
      {nav.map(([k,e,l])=>(
        <button key={k} onClick={()=>{setView(k);setOpenId(null);}}
          className={`nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-left ${view===k&&!openId?'nav-active bg-zinc-800/80 text-white shadow-[inset_0_1px_0_rgba(255,255,255,.05)]':'text-zinc-400 hover:bg-zinc-900/70 hover:text-zinc-200'}`}>
          <span className="emo">{e}</span>{l}
          {k==='inbox' && (data.inbox||[]).length>0 && <span className="ml-auto text-[10px] bg-amber-500 text-black rounded-full px-1.5 font-bold">{(data.inbox||[]).length}</span>}
        </button>
      ))}
      <div className="mt-auto">
        {activeProject && <div className="timer-pulse mb-3 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30">
          <div className="text-[11px] uppercase tracking-wide text-amber-400/80">läuft</div>

    {/* Main */}

        <button onClick={exportData} className="shrink-0 bg-amber-500 text-black font-semibold rounded-lg px-3 py-1.5 text-xs hover:bg-amber-400">Jetzt sichern</button>

      <div key={openId||view} className="view-enter">

                  startTimer={startTimer} stopTimer={stopTimer} activeTimer={data.activeTimer} runningSecs={runningSecs} cheer={cheer}/> :
       view==='today' ? <Today data={data} update={update} go={(v,id)=>{setView(v);setOpenId(id||null);}} activeProject={activeProject} runningSecs={runningSecs} stopTimer={stopTimer} cheer={cheer}/> :

const AREA_LABELS={uni:'🎓 Uni',sidehustle:'🚀 Side-Hustles',leben:'🗂️ Leben'};
const groupByArea=items=>['uni','sidehustle','leben'].map(a=>({a,label:AREA_LABELS[a],items:items.filter(x=>x.p.area===a)})).filter(g=>g.items.length>0);
function Section({title,extra,children}){
  const [open,setOpen]=useState(true);
  return <Card>
    <div className={`flex items-center justify-between ${open?'mb-3':''}`}>
      <button onClick={()=>setOpen(o=>!o)} className="flex items-center gap-2 text-sm text-zinc-400 hover:text-zinc-200">
        <span className="text-zinc-600 text-xs w-3 inline-block">{open?'▾':'▸'}</span>{title}

/* ---------- Einklappbarer Block (Zustand wird gespeichert) ---------- */
function Collapse({id,data,update,title,extra,children,className=''}){
  const collapsed=!!(data.ui&&data.ui.collapsed&&data.ui.collapsed[id]);
  const toggle=()=>update(d=>{ if(!d.ui)d.ui={}; if(!d.ui.collapsed)d.ui.collapsed={}; d.ui.collapsed[id]=!d.ui.collapsed[id]; });
  return <Card className={className}>
    <div className={`flex items-center justify-between ${collapsed?'':'mb-3'}`}>
      <button onClick={toggle} className="flex items-center gap-2 text-sm text-zinc-300 hover:text-white">
        <span className="text-zinc-600 text-xs w-3 inline-block">{collapsed?'▸':'▾'}</span>{title}
      </button>
      {!collapsed && extra}
    </div>
    {!collapsed && children}
  </Card>;
}

/* ---------- Countdown ---------- */
function CountdownCard({c,update}){
  const [open,setOpen]=useState(false); const [edit,setEdit]=useState(false);
  const days=daysUntil(c.date);
  const tone = days<0?'past':days<=7?'red':days<=30?'amber':'green';
  const toneCls={past:'text-zinc-500',red:'text-red-400',amber:'text-amber-400',green:'text-emerald-400'}[tone];
  const borderCls={past:'border-white/5',red:'border-red-500/40',amber:'border-amber-500/30',green:'border-emerald-500/25'}[tone];
  const big = days<0?'✓':days===0?'Heute':days;
  const sub = days<0?'vorbei':days===0?'der Tag':days===1?'Tag':'Tage';
  const upd=fn=>update(d=>{const x=d.countdowns.find(z=>z.id===c.id);if(x)fn(x);});
  return <div className={`cd-card group relative ${open?'cd-open':''}`}>
    <div onClick={()=>!edit&&setOpen(o=>!o)}
      className={`rounded-2xl border ${borderCls} bg-zinc-900/70 px-4 py-3 min-w-[120px] cursor-pointer select-none lift`}>
      <div className="flex items-center justify-between mb-0.5">
        <span className="text-lg leading-none emo">{c.emoji||'📌'}</span>
        <div className="flex gap-1.5 opacity-0 group-hover:opacity-100 transition">
          <button onClick={e=>{e.stopPropagation();setOpen(false);setEdit(v=>!v);}} className="text-xs text-zinc-600 hover:text-zinc-300" title="Bearbeiten">⚙</button>
          <button onClick={e=>{e.stopPropagation();if(!confirm('Countdown wirklich löschen?'))return;update(d=>{d.countdowns=d.countdowns.filter(x=>x.id!==c.id);});}} className="text-xs text-zinc-600 hover:text-zinc-400" title="Löschen">×</button>
        </div>
      </div>
      <div className={`text-3xl font-bold tabular-nums leading-none ${toneCls}`}>{big}</div>
      <div className="text-[10px] uppercase tracking-wide text-zinc-500 mt-0.5">{sub}</div>
      <div className="text-xs text-zinc-300 truncate mt-1 max-w-[150px]">{c.label}</div>
    </div>
    {!edit && <div className="cd-pop absolute left-0 top-full mt-2 z-40 w-60 max-w-[calc(100vw-2.5rem)] rounded-xl border border-zinc-700 bg-zinc-950 p-3 text-xs shadow-2xl ring-1 ring-black/60">
      {days<0
        ? <div className="text-zinc-400">War am {fmtTargetDate(c.date)} — vor {Math.abs(days)} Tagen.</div>
        : <div>
            <div className="text-zinc-200 font-semibold mb-1.5">{days===0?'Heute ist der Tag! 🎯':`${days} Tage bis ${c.label}`}</div>
            {days>0 && <div className="space-y-1 text-zinc-400">
              <div>≈ <span className="text-zinc-200">{de1(days/30.44)}</span> Monate</div>
              <div><span className="text-zinc-200">{de1(days/7)}</span> Wochen</div>
              <div>~<span className="text-zinc-200">{workdaysUntil(c.date)}</span> Werktage (Mo–Fr)</div>
              <div className="pt-1 border-t border-zinc-800 text-zinc-300">Ziel: {fmtTargetDate(c.date)}</div>
            </div>}
          </div>}
    </div>}
    {edit && <div onClick={e=>e.stopPropagation()} className="absolute left-0 top-full mt-2 z-50 w-64 rounded-xl border border-white/10 bg-zinc-950 p-3 space-y-2 shadow-2xl">
      <div className="flex gap-2">
        <input defaultValue={c.emoji} onChange={e=>upd(x=>x.emoji=e.target.value)} placeholder="🎯" className="w-14 bg-zinc-800 rounded-lg px-2 py-1.5 text-center outline-none"/>
        <input defaultValue={c.label} onChange={e=>upd(x=>x.label=e.target.value)} placeholder="Label" className="flex-1 bg-zinc-800 rounded-lg px-2 py-1.5 text-xs outline-none"/>
      </div>
      <input type="date" defaultValue={c.date} onChange={e=>{if(e.target.value)upd(x=>x.date=e.target.value);}} className="w-full bg-zinc-800 rounded-lg px-2 py-1.5 text-xs outline-none"/>
      <button onClick={()=>setEdit(false)} className="w-full bg-amber-500 text-black font-semibold rounded-lg py-1.5 text-xs hover:bg-amber-400">Fertig</button>
    </div>}
  </div>;
}
function Countdowns({data,update}){
  const list=[...(data.countdowns||[])].sort((a,b)=>{const x=daysUntil(a.date),y=daysUntil(b.date);const nx=x<0?1e9-x:x,ny=y<0?1e9-y:y;return nx-ny;});
  const add=()=>update(d=>{ if(!d.countdowns)d.countdowns=[]; d.countdowns.push({id:uid(),emoji:'📌',label:'Neues Ziel',date:addDaysKey(30)}); });
  return <Collapse id="countdown" data={data} update={update} className="relative z-30" title={<span>⏳ Countdown</span>} extra={<span className="text-[11px] text-zinc-600">Hover / Tap = Details</span>}>
    <div className="flex flex-wrap gap-3">
      {list.map(c=><CountdownCard key={c.id} c={c} update={update}/>)}
      <button onClick={add} className="min-w-[120px] rounded-2xl border border-dashed border-zinc-700 hover:border-amber-500/50 text-zinc-500 hover:text-amber-400 px-4 py-3 text-sm flex items-center justify-center transition">+ Ziel</button>
    </div>
  </Collapse>;
}

/* ---------- 1 Big Thing ---------- */
function BigThing({data,update}){
  const tk=todayKey(); const saved=(data.bigThing||{})[tk]||'';
  const [text,setText]=useState(saved);
  const save=v=>update(d=>{ if(!d.bigThing)d.bigThing={}; const t=(v||'').trim(); if(t)d.bigThing[tk]=t; else delete d.bigThing[tk]; });
  const prio=data.projects.flatMap(p=>p.todos.filter(t=>!t.done&&(t.prio||0)>0).map(t=>({p,t}))).sort((a,b)=>(b.t.prio||0)-(a.t.prio||0)).slice(0,7);
  return <Collapse id="bigThing" data={data} update={update} className="relative z-40" title={<span>⭐ 1 Big Thing heute</span>} extra={<span className="text-[11px] text-zinc-600">Hover = aus Prio wählen</span>}>
    <div className="bt-wrap group relative">
      <input value={text} onChange={e=>setText(e.target.value)} onBlur={e=>save(e.target.value)}
        placeholder="Was ist heute DIE eine Sache?"
        className="w-full bg-transparent text-xl font-semibold text-zinc-100 placeholder-zinc-600 outline-none border-b border-zinc-800 focus:border-amber-500 pb-2 transition"/>
      {prio.length>0 && <div className="bt-pop absolute left-0 top-full mt-2 z-50 w-full max-w-md rounded-xl border border-zinc-700 bg-zinc-950 p-2 shadow-2xl ring-1 ring-black/60">
        <div className="text-[10px] uppercase tracking-wide text-zinc-500 px-2 py-1">Aus deinen Prioritäten</div>
        {prio.map(({p,t})=><button key={t.id} onMouseDown={e=>e.preventDefault()} onClick={()=>{ setText(t.text); save(t.text); }}
          className="w-full flex items-center gap-2 text-left px-2 py-1.5 rounded-lg hover:bg-zinc-800 text-sm">
          <span className={`font-bold text-xs shrink-0 ${t.prio===3?'text-red-500':t.prio===2?'text-orange-400':'text-amber-300'}`}>{'!'.repeat(t.prio)}</span>
          <span className="flex-1 truncate">{t.text}</span>
          <span className="text-xs shrink-0 emo">{p.emoji}</span>
        </button>)}
      </div>}
    </div>
  </Collapse>;
}

/* ---------- Heute geschafft ---------- */

/* ---------- Fokus: Produktiv vs. Handy (Woche) ---------- */
function FokusWeek({data,update,prodWeekSecs,prodTodaySecs}){
  const tk=todayKey();
  const wkDays=(()=>{ const m=new Date(); m.setHours(0,0,0,0); m.setDate(m.getDate()-((m.getDay()+6)%7)); return [...Array(7)].map((_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return todayKey(d); }); })();
  const mode=(data.ui&&data.ui.fokusMode)==='today'?'today':'week';
  const isToday=mode==='today';
  const setMode=m=>update(d=>{ if(!d.ui||typeof d.ui!=='object')d.ui={}; d.ui.fokusMode=m; });
  const st=data.screenTime||{};
  const screenWk=isToday ? (+st[tk]||0) : wkDays.reduce((a,k)=>a+(+st[k]||0),0);
  const prodSecs=isToday ? (prodTodaySecs||0) : (prodWeekSecs||0); const prodH=prodSecs/3600;
  const sg=(data.goals&&data.goals.screen)||{};
  const limit=isToday ? (+sg.day||0) : (+sg.week||0);
  const over=limit>0 && screenWk>limit;
  const prodWins=prodH>=screenWk;
  const lbl=isToday?'heute':'diese Woche';
  const todayVal=st[tk];
  const [v,setV]=useState(todayVal!=null?String(todayVal):'');
  useEffect(()=>{ setV(todayVal!=null?String(todayVal):''); },[todayVal]);
  const save=()=>{ const h=parseFloat(v); update(d=>{ if(!d.screenTime)d.screenTime={}; if(v===''||isNaN(h)) delete d.screenTime[tk]; else d.screenTime[tk]=Math.max(0,h); }); };
  const setLimit=()=>{ const cur=isToday?(+sg.day||2):(+sg.week||14); const n=prompt('Handy-Limit '+(isToday?'pro Tag':'pro Woche')+' (Stunden)?', cur); if(n===null)return; const x=parseFloat(n); update(d=>{ ensureGoals(d); if(isToday) d.goals.screen.day=isNaN(x)?0:Math.max(0,x); else d.goals.screen.week=isNaN(x)?0:Math.max(0,x); }); };
  return <Card>
    <div className="flex items-center justify-between mb-3 gap-2">
      <div className="text-sm text-zinc-400 shrink-0">🪞 Fokus</div>
      <div className="flex items-center gap-1 ml-auto">
        <div className="flex bg-zinc-800/60 rounded-lg p-0.5 text-xs">
          {[['week','Woche'],['today','Heute']].map(([m,l])=><button key={m} onClick={()=>setMode(m)} className={`px-2.5 py-1 rounded-md ${mode===m?'bg-amber-500 text-black font-semibold':'text-zinc-400 hover:text-zinc-200'}`}>{l}</button>)}
        </div>
        <button onClick={setLimit} className="text-[10px] text-zinc-600 hover:text-zinc-400 ml-1">Limit ⚙</button>
      </div>
    </div>
    <div className="grid grid-cols-2 gap-3 mb-3">
      <div className="rounded-xl bg-zinc-800/40 p-3">
        <div className="text-[11px] text-zinc-400">🎯 Produktiv <span className="text-zinc-600">· Uni+Side</span></div>
        <div className="text-3xl font-bold tabular-nums text-emerald-400">{fmtHrs(prodSecs)}</div>
        <div className="text-[10px] text-zinc-600">{lbl}</div>
      </div>
      <div className="rounded-xl bg-zinc-800/40 p-3">
        <div className="text-[11px] text-zinc-400">📱 Handy</div>
        <div className={`text-3xl font-bold tabular-nums ${over?'text-red-400':'text-sky-300'}`}>{screenWk.toFixed(1)}h</div>
        <div className="text-[10px] text-zinc-600">{lbl}</div>
      </div>
    </div>
    <div className={`text-xs rounded-lg px-3 py-2 mb-3 ${(screenWk===0&&prodSecs===0)?'bg-zinc-800/50 text-zinc-500':prodWins?'bg-emerald-500/10 text-emerald-300':'bg-red-500/10 text-red-300'}`}>
      {(screenWk===0&&prodSecs===0) ? ('⚪ Noch nichts erfasst '+lbl+'.') : prodWins ? '🟢 Mehr produktiv als am Handy — stark, dranbleiben!' : `🔴 ${(screenWk-prodH).toFixed(1)}h mehr am Handy als produktiv.`}
    </div>
    {limit>0 && <div className="mb-3">
      <div className="flex justify-between text-[10px] text-zinc-500 mb-1"><span>Handy-Limit {isToday?'/Tag':'/Woche'}</span><span className="tabular-nums">{screenWk.toFixed(1)} / {limit}h{over&&<span className="text-red-400"> · drüber!</span>}</span></div>
      <div className="h-2.5 bg-zinc-800 rounded-full overflow-hidden"><div className={`h-full rounded-full bar-fill ${over?'bg-gradient-to-r from-red-500 to-orange-500':'bg-gradient-to-r from-sky-500 to-indigo-500'}`} style={{width:`${Math.min(100,limit>0?Math.round(screenWk/limit*100):0)}%`}}/></div>
    </div>}
    <div className="flex items-center gap-2">
      <span className="text-xs text-zinc-400 shrink-0">📱 heute:</span>
      <input type="number" step="0.1" min="0" value={v} onChange={e=>setV(e.target.value)} placeholder="z.B. 3.5" className="w-20 bg-zinc-800 rounded-lg px-2 py-1.5 text-sm outline-none focus:ring-1 focus:ring-amber-500"/>
      <span className="text-xs text-zinc-500">h</span>
      <button onClick={save} className="text-xs bg-amber-500 text-black font-semibold rounded-lg px-3 py-1.5 hover:bg-amber-400">{todayVal!=null?'Ändern':'Speichern'}</button>
      {todayVal!=null && <span className="text-[10px] text-zinc-600 ml-auto">heute {todayVal}h</span>}
    </div>
  </Card>;
}

    <button onClick={()=>go(areaView(p.area),p.id)} className="text-xs text-zinc-500 hover:text-amber-400 shrink-0"><span className="emo">{p.emoji}</span> →</button>

  return <div className="space-y-5">

        {[...new Set(data.habits.map(h=>h.cat||'Sonstige'))].map(c=>{ const hs=data.habits.filter(h=>(h.cat||'Sonstige')===c); const done=hs.filter(h=>h.history[tk]).length; const pct=hs.length?Math.round(done/hs.length*100):0; const full=hs.length>0&&done===hs.length; return (
          <button key={c} onClick={()=>go('habits')} className="relative overflow-hidden flex items-center gap-2 bg-zinc-800/50 hover:bg-zinc-800 rounded-xl px-3 py-2 text-left transition">

            <span className="text-sm flex-1 truncate relative z-10">{c}</span>
            <span className={`text-xs tabular-nums shrink-0 relative z-10 ${full?'text-emerald-300':'text-zinc-300'}`}>{done}/{hs.length}</span>
          </button>);})}
      </div>
      <button onClick={()=>go('habits')} className="text-xs text-zinc-500 hover:text-amber-400 mt-3">→ im Habits-Tab abhaken</button>
    </Section>

    <Section title="🎯 Todos heute" extra={<div className="flex items-center gap-1.5">
      {[['prio','🔴 Prio'],['quick','⚡ Schnell'],['cats','📂 Kategorien']].map(([k,l])=>
        <button key={k} onClick={()=>setFocusMode(k)} className={`text-xs px-2.5 py-1 rounded-lg ${focusMode===k?'bg-amber-500 text-black font-semibold':'bg-zinc-800 text-zinc-400 hover:text-zinc-200'}`}>{l}</button>)}

        ? (prioSorted.length===0 ? <div className="text-zinc-600 text-sm">Keine Prioritäten offen.</div> :
           [3,2,1].map(lvl=>{ const items=prioSorted.filter(x=>(x.t.prio||0)===lvl); if(!items.length) return null;
             return <div key={lvl} className="mb-2">
               <div className={`text-[11px] font-bold mt-1 mb-1.5 ${lvl===3?'text-red-500':lvl===2?'text-orange-400':'text-amber-300'}`}>{'!'.repeat(lvl)}<span className="text-zinc-600 font-normal ml-2">{lvl===3?'dringend':lvl===2?'wichtig':'bald'}</span></div>
               <div className="space-y-2">{items.map((x,i)=>sortRow(x,i,items.length,movePrio))}</div>
             </div>; }))
        : focusMode==='cats'
        ? (prioSorted.length===0 ? <div className="text-zinc-600 text-sm">Keine Prioritäten offen.</div> :
           groupByArea(prioSorted).map(g=><div key={g.a} className="mb-2">
             <div className="text-[11px] uppercase tracking-wide text-zinc-500 mt-1 mb-1.5">{g.label}</div>
             <div className="space-y-2">{g.items.map((x,i)=>sortRow(x,i,g.items.length,moveCat))}</div>
           </div>))
        : ((quickTimed.length+quickUntimed.length)===0 ? <div className="text-zinc-600 text-sm">Keine offenen Todos.</div> :
           <div>
             <div className="space-y-2">{quickTimed.map((x,i)=>sortRow(x,i,quickTimed.length,moveQuick))}</div>
             {quickUntimed.length>0 && <div>
               <div className="text-[11px] uppercase tracking-wide text-zinc-600 mt-3 mb-1.5">ohne Dauer</div>
               <div className="space-y-2">{quickUntimed.map((x,i)=>sortRow(x,i,quickUntimed.length,moveQuick))}</div>
             </div>}
           </div>)}
    </Section>

    <DoneLog data={data} update={update}/>

    <HelpfulLinks data={data} update={update}/>
  </div>;
}

function SleepInput({onSave}){
  const [h,setH]=useState(7.5); const [q,setQ]=useState('😐');
  return <div className="flex items-center gap-2 flex-wrap gap-y-2">
    <input type="number" step="0.5" value={h} onChange={e=>setH(parseFloat(e.target.value))} className="w-16 bg-zinc-800 rounded-lg px-2 py-1.5 text-lg"/>
    <span className="text-sm text-zinc-500">h</span>
    <div className="flex items-center gap-1 shrink-0">
      {['😫','😐','😀'].map(e=><button key={e} onClick={()=>setQ(e)} className={`text-xl p-1 rounded transition emo ${q===e?'bg-zinc-700 scale-110':'hover:bg-zinc-800'}`}>{e}</button>)}
    </div>
    <button onClick={()=>onSave(h,q)} className="ml-auto text-xs bg-amber-500 text-black font-semibold rounded-lg px-3 py-1.5 hover:bg-amber-400">Speichern</button>
  </div>;
}

/* ---------- Area (Uni / Side-Hustles) ---------- */
function CatSelect({value,options,onChange,allowEmpty}){
  const opts=[...new Set(options)];
  return <select value={value||''} onChange={e=>{const v=e.target.value; if(v==='__new__'){const n=prompt('Neue Kategorie? (z.B. 💰 Geld, 🎨 Kreativ)'); if(n&&n.trim())onChange(n.trim());} else onChange(v);}} className="bg-zinc-800 text-zinc-300 text-xs rounded-lg px-2 py-1 outline-none max-w-[75%]">
    {allowEmpty && <option value="">— ohne —</option>}
    {value && !opts.includes(value) && <option value={value}>{value}</option>}
    {opts.map(c=><option key={c} value={c}>{c}</option>)}
    <option value="__new__">➕ Neue Kategorie…</option>
  </select>;
}

function Area({data,update,area,title,open,prioritizable}){
  const list=data.projects.filter(p=>p.area===area);
  const move=(id,dir)=>update(d=>{
    const arr=d.projects; const idx=arr.findIndex(p=>p.id===id); const cat=arr[idx].pcat||'';
    const sib=arr.map((p,i)=>({p,i})).filter(x=>x.p.area===area && (x.p.pcat||'')===cat);
    const pos=sib.findIndex(x=>x.p.id===id); const swap=sib[pos+dir]; if(!swap)return;
    [arr[idx],arr[swap.i]]=[arr[swap.i],arr[idx]];
  });
  const addProject=()=>{ const name=prompt('Projektname?'); if(name) update(d=>{d.projects.push({id:uid(),area,emoji:'🆕',name,time:{},todos:[],links:[]});}); };
  const cats=[...new Set(list.map(p=>p.pcat).filter(Boolean))];
  const grouped=cats.length>0;
  const groups=grouped?[...cats,...(list.some(p=>!p.pcat)?['📂 Ohne Kategorie']:[])]:['__all__'];
  const renderCard=p=>{ const wk=weekKey(); const done=p.todos.filter(t=>t.done).length; const prog=p.todos.length?Math.round(done/p.todos.length*100):0;
    return <div key={p.id} className={`group lift bg-zinc-900/70 rounded-2xl p-4 glow flex items-center gap-4 hover:bg-zinc-900/90 ${p.highlight?'ring-2 ring-amber-500/70':''}`}>
      {prioritizable && <div className="flex flex-col text-zinc-600">
        <button onClick={()=>move(p.id,-1)} className="hover:text-amber-400 leading-none">▲</button>
        <button onClick={()=>move(p.id,1)} className="hover:text-amber-400 leading-none">▼</button>
      </div>}
      <button onClick={()=>open(p.id)} className="flex-1 text-left">
        <div className="flex items-center gap-2">
          <span className="text-xl emo">{p.emoji}</span>
          <span className="font-semibold">{p.name}</span>
          <StreakBadge data={data} p={p}/>
        </div>
        <div className="flex items-center gap-3 mt-2">
          <div className="flex-1"><Bar value={prog}/></div>
          <span className="text-xs text-zinc-500 tabular-nums">{done}/{p.todos.length}</span>
          <span className="text-xs text-amber-400/80 tabular-nums">{fmtHrs(projWeek(p))}/Wo</span>
        </div>
      </button>
    </div>;};
  return <div className="space-y-4">
    <div className="flex items-center justify-between gap-3">
      <h1 className="text-3xl font-bold truncate">{title}</h1>
      <button onClick={addProject} className="text-sm bg-zinc-800 hover:bg-zinc-700 rounded-xl px-4 py-2 shrink-0">+ Projekt</button>
    </div>
    {prioritizable && <p className="text-xs text-zinc-500">Reihenfolge = Priorität (▲▼). Kategorie wählst/erstellst du im Projekt-Detail.</p>}
    {groups.map(g=><div key={g}>
      {grouped && <div className="text-xs uppercase tracking-wide text-zinc-500 mb-2 mt-5">{g}</div>}
      <div className="space-y-3">
        {list.filter(p=>grouped?((p.pcat||'📂 Ohne Kategorie')===g):true).map(renderCard)}
      </div>
    </div>)}
  </div>;
}

/* ---------- Projekt-Detail ---------- */
function ProjectDetail({data,update,id,back,startTimer,stopTimer,activeTimer,runningSecs,cheer}){

    </div>
    <div className="flex items-center gap-3">
      <button onClick={()=>{const e=prompt('Neues Emoji?',p.emoji);if(e!==null){const v=e.trim();if(v)update(d=>{d.projects.find(x=>x.id===id).emoji=v;});}}} className="text-3xl hover:opacity-70 leading-none emo" title="Emoji ändern">{p.emoji}</button>
      <h1 className="text-3xl font-bold">{p.name}</h1>
      <button onClick={()=>{const n=prompt('Neuer Projektname?',p.name);if(n&&n.trim())update(d=>{d.projects.find(x=>x.id===id).name=n.trim();});}} className="text-zinc-600 hover:text-zinc-400 text-base" title="Name ändern">✏️</button>
      <StreakBadge data={data} p={p}/>
      <button onClick={()=>update(d=>{const x=d.projects.find(z=>z.id===id);x.highlight=!x.highlight;})} className={`ml-auto text-2xl ${p.highlight?'text-amber-400':'text-zinc-700 hover:text-zinc-400'}`} title="Projekt hervorheben">{p.highlight?'★':'☆'}</button>
      <button onClick={()=>{ if(confirm(`Projekt „${p.name}" wirklich löschen? Alle Todos, Links und Zeiten gehen dabei verloren.`)){ update(d=>{d.projects=d.projects.filter(x=>x.id!==id);}); back(); } }} className="ml-1 text-xl text-zinc-700 hover:text-red-400" title="Projekt löschen">🗑</button>
    </div>

    <div className="-mt-2 flex items-center gap-2">
      <span className="text-xs text-zinc-600">Kategorie:</span>
      <CatSelect value={p.pcat} options={[...new Set(data.projects.filter(x=>x.area===p.area).map(x=>x.pcat).filter(Boolean))]} allowEmpty onChange={c=>update(d=>{d.projects.find(x=>x.id===id).pcat=c;})}/>
    </div>

    <Card>
      <div className="text-sm text-zinc-400 mb-2">📝 Beschreibung</div>
      <textarea defaultValue={p.note||''} onBlur={e=>update(d=>{d.projects.find(x=>x.id===id).note=e.target.value;})} placeholder="Worum geht's bei diesem Projekt?" className="w-full h-24 bg-zinc-800 rounded-lg px-3 py-2 text-sm resize-none outline-none focus:ring-1 focus:ring-amber-500"/>
    </Card>

    <div className="grid grid-cols-2 gap-4">
      <Card>
        <div className="text-sm text-zinc-400 mb-1">⏱ Zeit diese Woche</div>
        <div className="text-3xl font-bold tabular-nums">{fmtDur(weekSecs)}</div>
        <button onClick={()=>isRunning?stopTimer():startTimer(id)}

      </Card>
      <Card>
        <div className="text-sm text-zinc-400 mb-2">🔗 Inspo & Links</div>
        <div className="space-y-1.5">

            <a href={l.url} target="_blank" className="text-sm text-amber-400 hover:underline truncate">↗ {l.label}</a>

            <button onClick={()=>{if(!confirm('Todo wirklich löschen?'))return;update(d=>{const x=d.projects.find(z=>z.id===id);x.todos=x.todos.filter(z=>z.id!==t.id);});}} className="text-xs text-zinc-700 group-hover:text-zinc-500 shrink-0">×</button>

/* ---------- Habit-Trend ---------- */
function HabitTrend({data}){
  const [range,setRange]=useState(7);
  const habits=data.habits||[]; const tk=todayKey();
  const days=[...Array(range)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(range-1-i)); return d; });
  const vals=days.map(d=>{ const dk=todayKey(d); const done=habits.filter(h=>h.history&&h.history[dk]).length; return habits.length?Math.round(done/habits.length*100):0; });
  const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  return <Card>
    <div className="flex items-center justify-between mb-3">
      <div className="text-sm text-zinc-400">📈 Habit-Trend</div>
      <div className="flex gap-1">
        {[7,30].map(r=><button key={r} onClick={()=>setRange(r)} className={`text-xs px-2.5 py-1 rounded-lg ${range===r?'bg-amber-500 text-black font-semibold':'bg-zinc-800 text-zinc-400 hover:text-zinc-200'}`}>{r} Tage</button>)}
      </div>
    </div>
    <div className="flex items-end gap-0.5 h-20">
      {vals.map((v,i)=>{ const isToday=todayKey(days[i])===tk; return <div key={i} title={`${days[i].toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}: ${v}%`}
        className={`bar-fill flex-1 rounded-t bg-gradient-to-t ${v>=80?'from-emerald-500 to-emerald-400':'from-amber-500 to-orange-400'} ${v===0?'opacity-25':''} ${isToday?'ring-1 ring-white/40':''}`}
        style={{height:`${Math.max(3,v)}%`}}/>; })}
    </div>
    <div className="flex justify-between text-[10px] text-zinc-600 mt-1.5"><span>{days[0].toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}</span><span>Ø {avg}%</span><span>heute</span></div>

}

function Habits({data,update}){
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
  const freqOf=h=>h.freq||7;
  const weekDayKeys=date=>{const m=new Date(date);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return todayKey(d);});};
  const weekChecks=(h,date)=>weekDayKeys(date).filter(k=>h.history[k]).length;
  const weekFulfilled=(h,date)=>weekChecks(h,date)>=freqOf(h);
  const isDone=(h,date)=>!!h.history[todayKey(date)]||weekFulfilled(h,date);
  const streakInfo=h=>{ let s=0; const frozen=new Set(); let run=0; let onIce=false, edge=true; const d=new Date(); for(;;){ const k=todayKey(d); if(isDone(h,d)){ s++; run=0; if(edge){onIce=false;edge=false;} d.setDate(d.getDate()-1); continue; } if(s===0&&k===todayKey()){ d.setDate(d.getDate()-1); continue; } run++; if(run>1) break; const o=new Date(d); o.setDate(o.getDate()-1); if(isDone(h,o)){ frozen.add(k); if(edge){onIce=true;edge=false;} d.setDate(d.getDate()-1); continue; } break; } return {count:s, frozen, freezes:frozen.size, onIce, ice:frozen.size>0}; };
  const streak=h=>streakInfo(h).count;
  const add=()=>{const n=prompt('Neue Habit?');if(n)update(d=>{const nid=uid();d.habits.push({id:nid,name:n,emoji:'⭐',cat:'🆕 Neu',goal:'1x',history:{},links:[]});if(!Array.isArray(d.habitOrder))d.habitOrder=[];d.habitOrder.push(nid);});};
  const [editId,setEditId]=useState(null);
  const [linkL,setLinkL]=useState(''); const [linkU,setLinkU]=useState('');
  const sortMode=data.habitSort||'custom';
  const cats=[...new Set(data.habits.map(h=>h.cat||'Sonstige'))];
  const tk=todayKey();
  const doneToday=data.habits.filter(h=>h.history[tk]).length;
  const delHabit=hid=>{ if(!confirm('Diese Gewohnheit wirklich löschen?'))return; update(d=>{d.habits=d.habits.filter(z=>z.id!==hid);if(Array.isArray(d.habitOrder))d.habitOrder=d.habitOrder.filter(x=>x!==hid);}); };
  const moveHabit=(hid,dir)=>update(d=>{
    if(sortMode==='custom'){
      if(!Array.isArray(d.habitOrder)||!d.habitOrder.length)d.habitOrder=d.habits.map(h=>h.id);
      const ord=d.habitOrder; const idx=ord.indexOf(hid); const j=idx+dir;
      if(idx<0||j<0||j>=ord.length)return; [ord[idx],ord[j]]=[ord[j],ord[idx]];
    } else {
      const arr=d.habits; const idx=arr.findIndex(h=>h.id===hid); const cat=arr[idx].cat||'Sonstige'; const sib=arr.map((h,i)=>({h,i})).filter(x=>(x.h.cat||'Sonstige')===cat); const pos=sib.findIndex(x=>x.h.id===hid); const swap=sib[pos+dir]; if(!swap)return; [arr[idx],arr[swap.i]]=[arr[swap.i],arr[idx]];
    }
  });
  const orderIds=Array.isArray(data.habitOrder)?data.habitOrder:[];
  const byId={}; data.habits.forEach(h=>{byId[h.id]=h;});
  const customList=[...orderIds.map(id=>byId[id]).filter(Boolean),...data.habits.filter(h=>orderIds.indexOf(h.id)<0)];
  const renderHabit=h=>{const info=streakInfo(h);return <Card key={h.id} className="!p-3">
    <div className="flex items-center gap-2">
      <div className="flex flex-col text-zinc-600 shrink-0 leading-none">
        <button onClick={()=>moveHabit(h.id,-1)} className="hover:text-amber-400 text-[10px]">▲</button>

      </div>
      <span className="text-lg shrink-0 emo">{h.emoji}</span>
      <span className="font-medium flex-1 text-sm leading-tight">{h.name}</span>
      {(h.links||[]).map((l,li)=><a key={li} href={lUrl(l)} target="_blank" title={lLabel(l)} className="text-amber-400 hover:underline text-sm shrink-0">↗</a>)}
      {freqOf(h)<7 && <span className={`text-[10px] px-2 py-0.5 rounded-full shrink-0 tabular-nums ${weekFulfilled(h,new Date())?'bg-emerald-500/20 text-emerald-300':'bg-zinc-800 text-zinc-500'}`} title="diese Woche erreicht / Wochenziel">📅 {weekChecks(h,new Date())}/{freqOf(h)}</span>}
      {info.freezes>0 && <span className="shrink-0 inline-flex items-center gap-0.5 text-[10px] font-semibold text-sky-300/90 bg-sky-500/10 ring-1 ring-sky-400/25 rounded-full px-1.5 py-0.5 tabular-nums" title={`${info.freezes}× in dieser Streak auf Eis gewesen (Tag verpasst, aber gehalten)`}>🧊 {info.freezes}×</span>}
      {!info.count ? <span className="text-xs text-zinc-600 shrink-0">🔥 0</span> : <span className={`shrink-0 inline-flex items-center gap-1 text-sm font-extrabold tabular-nums rounded-full px-2.5 py-0.5 ${info.onIce?'bg-sky-500/20 text-sky-300 ring-1 ring-sky-400/50 ice-glow':'bg-amber-500/15 text-amber-400 ring-1 ring-amber-400/30 fire-glow'}`} title={info.onIce?'Gerade auf Eis — hol den Tag heute nach, dann läuft die Streak normal weiter!':'Aktuelle Streak läuft'}>{info.onIce?'🧊':'🔥'} {info.count}</span>}
      <button onClick={()=>setEditId(editId===h.id?null:h.id)} className="text-xs text-zinc-700 hover:text-zinc-400 shrink-0" title="Name, Kategorie & Links">⚙</button>

        <input defaultValue={h.name} onBlur={e=>{const v=e.target.value.trim();if(v&&v!==h.name)update(d=>{d.habits.find(x=>x.id===h.id).name=v;});}} placeholder="Name der Habit" className="flex-1 bg-zinc-800 text-zinc-200 rounded px-2 py-1 outline-none"/>
      </div>
      <div className="flex items-center gap-2">
        <span className="text-zinc-500 w-16 shrink-0">Kategorie</span>
        <select value={h.cat||'Sonstige'} onChange={e=>update(d=>{d.habits.find(x=>x.id===h.id).cat=e.target.value;})} className="flex-1 bg-zinc-800 text-zinc-300 rounded px-2 py-1 outline-none">
          {cats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="flex items-center gap-1.5 flex-wrap">
        <span className="text-zinc-500 w-16 shrink-0">Ziel/Woche</span>

      </div>
      <p className="text-[10px] text-zinc-600 leading-snug">Wie oft pro Woche willst du das schaffen? Sobald das Ziel erreicht ist, zählt die ganze Woche als erfüllt — alle Tage werden grün und der Streak läuft weiter.</p>
      <div className="flex items-start gap-2">

          </div>)}
          {(h.links||[]).length===0 && <div className="text-zinc-600">Noch keine Links.</div>}
          <form onSubmit={e=>{e.preventDefault();if(linkU.trim()){update(d=>{const x=d.habits.find(z=>z.id===h.id);if(!x.links)x.links=[];x.links.push({label:linkL.trim()||linkU.trim().replace(/^https?:\/\//,''),url:linkU.trim()});});setLinkL('');setLinkU('');}}} className="flex gap-1.5 pt-0.5">

            <button className="bg-zinc-700 hover:bg-zinc-600 rounded px-3">+</button>
          </form>
        </div>
      </div>
    </div>}
    <div className="flex gap-1.5 mt-2.5">
      {days.map((d,i)=>{const k=todayKey(d);const on=h.history[k];const covered=!on&&isDone(h,d);const frozen=!on&&!covered&&info.frozen.has(k);const isToday=k===todayKey();return (
        <button key={i} onClick={()=>update(z=>{const x=z.habits.find(y=>y.id===h.id);if(x.history[k])delete x.history[k];else x.history[k]=true;})}

    <div className="-mt-3 flex items-center gap-2">
      <span className="text-xs text-zinc-600">Kategorie:</span>
      <CatSelect value={i.cat} options={cats} onChange={c=>update(d=>{d.ideas.find(x=>x.id===id).cat=c;})}/>
    </div>
    <Card>
      <div className="text-sm text-zinc-400 mb-2">📝 Beschreibung</div>
      <textarea defaultValue={i.note||''} onBlur={e=>update(d=>{d.ideas.find(x=>x.id===id).note=e.target.value;})} placeholder="Beschreibe die Idee genauer — worum geht's, warum spannend, erste Gedanken…" className="w-full h-44 bg-zinc-800 rounded-lg px-3 py-2 text-sm resize-none outline-none focus:ring-1 focus:ring-amber-500"/>
    </Card>
    <Card>
      <div className="text-sm text-zinc-400 mb-2">🛠️ Tools</div>
      <ToolTags tools={i.tools} suggestions={allTools(data)} onAdd={t=>update(d=>{const x=d.ideas.find(z=>z.id===id);if(!x.tools)x.tools=[];x.tools.push(t);})} onRemove={idx=>update(d=>{d.ideas.find(z=>z.id===id).tools.splice(idx,1);})}/>
    </Card>
    <Card>
      <div className="text-sm text-zinc-400 mb-2">🔗 Links</div>
      <div className="space-y-1.5">
        {(i.links||[]).map((u,li)=><div key={li} className="flex items-center gap-2">
          <a href={lUrl(u)} target="_blank" className="text-sm text-amber-400 hover:underline truncate flex-1">↗ {lLabel(u)}</a>
          <button onClick={()=>{if(!confirm('Link wirklich löschen?'))return;update(d=>{d.ideas.find(x=>x.id===id).links.splice(li,1);});}} className="text-xs text-zinc-700 hover:text-zinc-500 shrink-0">×</button>
        </div>)}
        {(i.links||[]).length===0 && <div className="text-xs text-zinc-600">Noch keine Links.</div>}
        <form onSubmit={e=>{e.preventDefault();if(linkU.trim()){update(d=>{const x=d.ideas.find(z=>z.id===id);if(!x.links)x.links=[];x.links.push({label:linkL.trim()||linkU.trim().replace(/^https?:\/\//,''),url:linkU.trim()});});setLinkL('');setLinkU('');}}} className="flex gap-1.5 pt-1">
          <input value={linkL} onChange={e=>setLinkL(e.target.value)} placeholder="Label (optional)" className="w-1/3 bg-zinc-800 rounded-lg px-2 py-1.5 text-xs"/>
          <input value={linkU} onChange={e=>setLinkU(e.target.value)} placeholder="https://…" className="flex-1 bg-zinc-800 rounded-lg px-2 py-1.5 text-xs"/>
          <button className="text-xs bg-zinc-700 hover:bg-zinc-600 rounded-lg px-3">+</button>
        </form>
      </div>
    </Card>
    <button onClick={()=>{update(d=>{const idea=d.ideas.find(x=>x.id===id);if(!idea)return;d.projects.push({id:uid(),area:'sidehustle',emoji:idea.emoji,name:idea.name,note:idea.note||'',status:'💡 Idee',time:{},todos:[],links:(idea.links||[]).map(u=>typeof u==='string'?{label:lLabel(u),url:u}:u),tools:idea.tools||[]});d.ideas=d.ideas.filter(x=>x.id!==id);});back();}} className="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 font-semibold text-sm">➜ Als aktiven Side-Hustle übernehmen</button>
  </div>;
}

/* ---------- Ideen-Pool ---------- */
function Ideas({data,update}){
  const [openId,setOpenId]=useState(null);
  const ideas=data.ideas||[];
  const cats=[...new Set(ideas.map(i=>i.cat))];
  if(openId && ideas.find(i=>i.id===openId)) return <IdeaDetail data={data} update={update} id={openId} back={()=>setOpenId(null)}/>;
  const activate=id=>update(d=>{
    const i=d.ideas.find(x=>x.id===id); if(!i) return;
    d.projects.push({id:uid(),area:'sidehustle',emoji:i.emoji,name:i.name,note:i.note||'',status:'💡 Idee',time:{},todos:[],links:(i.links||[]).map(u=>typeof u==='string'?{label:lLabel(u),url:u}:u),tools:i.tools||[]});
    d.ideas=d.ideas.filter(x=>x.id!==id);
  });
  const add=()=>{const n=prompt('Neue Idee?'); if(n) update(d=>{d.ideas.unshift({id:uid(),cat:'🆕 Neu',emoji:'💡',name:n});});};
  return <div className="space-y-5">
    <div className="flex items-start justify-between">
      <div>
        <h1 className="text-3xl font-bold">💡 Ideen-Pool</h1>
        <p className="text-xs text-zinc-500 mt-1 max-w-md">Alles aus deinen Canvases — geparkt, nichts verloren. Der Pfeil macht eine Idee zum aktiven Side-Hustle.</p>
      </div>
      <button onClick={add} className="text-sm bg-zinc-800 hover:bg-zinc-700 rounded-xl px-4 py-2 shrink-0">+ Idee</button>
    </div>
    {cats.map(c=><div key={c}>
      <div className="text-xs uppercase tracking-wide text-zinc-500 mb-2 mt-5">{c}</div>
      <div className="grid grid-cols-2 gap-2">
        {ideas.filter(i=>i.cat===c).map(i=><div key={i.id} className="lift flex items-center gap-2 bg-zinc-900/70 border border-white/5 rounded-xl px-3 py-2.5 group hover:bg-zinc-900 hover:border-amber-500/20">
          <button onClick={()=>setOpenId(i.id)} className="flex items-center gap-2 flex-1 text-left min-w-0">
            <span className="shrink-0 emo">{i.emoji}</span>
            <span className="text-sm leading-tight truncate">{i.name}</span>
            {(i.links||[]).length>0 && <span className="text-[10px] text-amber-400/70 shrink-0">🔗{(i.links||[]).length}</span>}
            {i.note && i.note.trim() && <span className="text-[10px] text-zinc-600 shrink-0">📝</span>}
          </button>
          <button onClick={()=>activate(i.id)} title="zu Side-Hustles befördern" className="text-xs text-zinc-600 hover:text-emerald-400 opacity-0 group-hover:opacity-100 shrink-0">➜</button>
          <button onClick={()=>{if(!confirm('Idee wirklich löschen?'))return;update(d=>{d.ideas=d.ideas.filter(x=>x.id!==i.id);});}} className="text-xs text-zinc-700 hover:text-zinc-500 shrink-0">×</button>
        </div>)}
      </div>
    </div>)}
    <div className="text-xs text-zinc-600 pt-3">{ideas.length} Ideen im Pool</div>
  </div>;
}

/* ---------- Inbox / Quick-Capture ---------- */
function InboxInput({onAdd}){
  const [v,setV]=useState('');
  return <form onSubmit={e=>{e.preventDefault();if(v.trim()){onAdd(v.trim());setV('');}}} className="flex gap-2">
    <input value={v} onChange={e=>setV(e.target.value)} autoFocus placeholder="Schnell rein damit… dann Enter" className="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:border-amber-500 outline-none"/>
    <button className="bg-amber-500 text-black font-semibold rounded-xl px-5 text-sm hover:bg-amber-400">+</button>
  </form>;
}
function Inbox({data,update}){
  const inbox=data.inbox||[];
  const add=text=>update(d=>{if(!d.inbox)d.inbox=[];d.inbox.unshift({id:uid(),text});});
  const toProject=(itemId,projId)=>update(d=>{const item=d.inbox.find(x=>x.id===itemId);const p=d.projects.find(x=>x.id===projId);if(item&&p){p.todos.push({id:uid(),text:item.text,done:false,prio:0,mins:0});d.inbox=d.inbox.filter(x=>x.id!==itemId);}});
  const toIdea=itemId=>update(d=>{const item=d.inbox.find(x=>x.id===itemId);if(item){if(!d.ideas)d.ideas=[];d.ideas.unshift({id:uid(),cat:'🆕 Neu',emoji:'💡',name:item.text});d.inbox=d.inbox.filter(x=>x.id!==itemId);}});
  const del=itemId=>{ if(!confirm('Eintrag wirklich löschen?'))return; update(d=>{d.inbox=d.inbox.filter(x=>x.id!==itemId);}); };
  return <div className="space-y-4">
    <div><h1 className="text-3xl font-bold">📥 Inbox</h1>
      <p className="text-xs text-zinc-500 mt-1 max-w-lg">Alles Lose landet hier — Gedanken, Todos, Ideen. Dann in Ruhe verarbeiten: einem Projekt als Todo zuordnen, zu Ideen schieben, oder weg damit.</p></div>
    <InboxInput onAdd={add}/>
    {inbox.length===0 ? <div className="text-zinc-600 text-sm pt-6 text-center">Inbox leer — sauberer Kopf. 🎉</div> :
      <div className="space-y-2">
        {inbox.map(it=><div key={it.id} className="bg-zinc-900/70 rounded-2xl p-3 glow">
          <div className="text-sm mb-2.5">{it.text}</div>
          <div className="flex items-center gap-2 flex-wrap">
            <select onChange={e=>{if(e.target.value)toProject(it.id,e.target.value);}} value="" className="bg-zinc-800 rounded-lg px-2 py-1.5 text-xs text-zinc-300 max-w-[55%]">
              <option value="">→ als Todo zu Projekt…</option>
              {data.projects.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
            </select>
            <button onClick={()=>toIdea(it.id)} className="text-xs bg-zinc-800 hover:bg-zinc-700 rounded-lg px-3 py-1.5">💡 zu Ideen</button>
            <button onClick={()=>del(it.id)} className="text-xs text-zinc-600 hover:text-zinc-400 ml-auto">× weg</button>
          </div>
        </div>)}
      </div>}
  </div>;
}

/* ---------- Hilfreiche Links (Heute) ---------- */
function HelpfulLinks({data,update}){
  const [label,setLabel]=useState(''); const [url,setUrl]=useState('');
  const links=data.helpfulLinks||[];
  return <Section title="🔗 Hilfreiche Seiten & Tools">
    <div className="flex flex-wrap gap-2 mb-3">
      {links.map((l,i)=><div key={i} className="inline-flex items-center gap-1.5 bg-zinc-800 rounded-lg px-2.5 py-1.5 group">
        <a href={lUrl(l)} target="_blank" className="text-xs text-amber-400 hover:underline">↗ {lLabel(l)}</a>
        <button onClick={()=>{if(!confirm('Link wirklich löschen?'))return;update(d=>{if(d.helpfulLinks)d.helpfulLinks.splice(i,1);});}} className="text-zinc-600 hover:text-zinc-400 text-xs opacity-0 group-hover:opacity-100">×</button>
      </div>)}
      {links.length===0 && <span className="text-xs text-zinc-600">Noch keine Links.</span>}
    </div>
    <form onSubmit={e=>{e.preventDefault();if(url.trim()){update(d=>{if(!d.helpfulLinks)d.helpfulLinks=[];d.helpfulLinks.push({label:label.trim()||url.trim().replace(/^https?:\/\//,''),url:url.trim()});});setLabel('');setUrl('');}}} className="flex gap-1.5">
      <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Label" className="w-1/4 bg-zinc-800 rounded-lg px-2 py-1.5 text-xs"/>
      <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://…" className="flex-1 bg-zinc-800 rounded-lg px-2 py-1.5 text-xs"/>
      <button className="text-xs bg-zinc-700 hover:bg-zinc-600 rounded-lg px-3">+</button>
    </form>
  </Section>;
}

/* ---------- Streak-Badge pro Projekt (nur sichtbar wenn Streak aktiv) ---------- */
function StreakBadge({data,p}){
  const s=projStreak(data,p); if(s<=0) return null;
  return <span className="inline-flex items-center gap-1 text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-full px-2 py-0.5 shrink-0">
    <span className="emo">🔥</span>{s} {s===1?'Tag':'Tage'}
  </span>;
}

/* ---------- Streaks-Seite (alle laufenden Streaks) ---------- */
function Streaks({data,go}){
  const av={uni:'uni',sidehustle:'side',leben:'leben'};
  const list=data.projects.map(p=>({p,s:projStreak(data,p)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return <div className="space-y-4">
    <div><h1 className="text-3xl font-bold">🔥 Streaks</h1>
      <p className="text-xs text-zinc-500 mt-1">Jeden Tag ein bisschen: Todo abhaken oder Timer laufen lassen hält die Flamme am Leben.</p></div>
    {list.length===0 ? <Card><div className="text-zinc-500 text-sm">Keine aktiven Streaks. Hak heute irgendwo ein Todo ab und zünde die erste Flamme. 🔥</div></Card> :
      <div className="space-y-2">
        {list.map(({p,s})=><button key={p.id} onClick={()=>go(av[p.area]||'side',p.id)}
          className="lift group w-full flex items-center gap-3 bg-zinc-900/70 border border-white/5 rounded-xl px-4 py-3 text-left hover:border-amber-500/20">
          <span className="text-2xl emo">{p.emoji}</span>
          <div className="flex-1 min-w-0">
            <div className="text-sm font-semibold truncate">{p.name}</div>
            <div className="text-[11px] text-zinc-500">{AREA_LABELS[p.area]||p.area}</div>
          </div>
          <span className="text-lg font-extrabold text-amber-400 tabular-nums shrink-0">🔥 {s}</span>
          <span className="text-xs text-zinc-500 shrink-0">{s===1?'Tag':'Tage'}</span>
        </button>)}
      </div>}
  </div>;
}

/* ---------- Streak-Celebration (Duolingo-Style) ---------- */
/* ---------- Sync-Panel ---------- */
function SyncPanel({cfg,state,onSave,onDisconnect,onPull,onPush,close}){
  const [token,setToken]=useState((cfg&&cfg.token)||'');
  const [gid,setGid]=useState((cfg&&cfg.gistId)||'');
  return <div className="fixed inset-0 z-[80] flex items-center justify-center p-4" onClick={close} style={{background:'rgba(0,0,0,.72)'}}>
    <div onClick={e=>e.stopPropagation()} className="w-full max-w-md bg-zinc-950 border border-zinc-700 rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div className="flex items-center justify-between">
        <div className="text-lg font-bold">☁️ Gist-Sync</div>
        <button onClick={close} className="text-zinc-500 hover:text-zinc-300 text-lg px-1">✕</button>
      </div>
      <div className="text-xs text-zinc-400 leading-relaxed space-y-1.5">
        <div><span className="text-zinc-200 font-semibold">1.</span> Auf <span className="text-amber-400">gist.github.com</span> ein <b>secret</b> Gist anlegen — Dateiname <code className="bg-zinc-800 px-1 rounded">lifeos.json</code>, Inhalt <code className="bg-zinc-800 px-1 rounded">{'{}'}</code>. Die Gist-ID ist der lange Code in der URL.</div>
        <div><span className="text-zinc-200 font-semibold">2.</span> github.com → Settings → Developer settings → Personal access tokens → <b>Token (classic)</b>, Haken NUR bei <b>gist</b>, ohne Ablauf.</div>
        <div><span className="text-zinc-200 font-semibold">3.</span> Beides hier eintragen — auf jedem Gerät dasselbe.</div>
      </div>
      <div className="space-y-2">
        <input value={token} onChange={e=>setToken(e.target.value)} type="password" placeholder="GitHub Token (ghp_…)" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-500"/>
        <input value={gid} onChange={e=>setGid(e.target.value)} placeholder="Gist-ID (aus der URL)" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-500"/>
      </div>
      <div className="flex gap-2 items-center">
        <button onClick={()=>onSave(token.trim(),gid.trim())} className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-semibold rounded-lg py-2 text-sm">Speichern & verbinden</button>
        {cfg && <button onClick={onDisconnect} className="text-xs text-zinc-500 hover:text-red-400 px-2 shrink-0">Trennen</button>}
      </div>
      {cfg && <div className="flex gap-2 text-xs">
        <button onClick={onPull} className="flex-1 bg-zinc-800 hover:bg-zinc-700 rounded-lg py-2">⬇ Von Cloud laden</button>
        <button onClick={onPush} className="flex-1 bg-zinc-800 hover:bg-zinc-700 rounded-lg py-2">⬆ Hochladen</button>
      </div>}
      <div className={"text-xs "+(state.s==='error'?'text-red-400':state.s==='syncing'?'text-amber-400':state.s==='ok'?'text-emerald-400':'text-zinc-500')}>
        {state.s==='off'?'Nicht verbunden.':state.s==='syncing'?'Synce…':state.s==='error'?('Fehler: '+state.msg):state.s==='ok'?('✓ Synchron · '+state.msg):'Bereit — verbinde dich.'}
      </div>
      <div className="text-[10px] text-zinc-600 leading-relaxed">Neuere Version gewinnt (Zeitstempel). Änderungen werden ~3 s nach der letzten Eingabe hochgeladen. Der Token bleibt nur in diesem Browser — er landet nie im Backup oder im Gist.</div>
    </div>
  </div>;
}

function StreakOverlay({c,onClose}){
  useEffect(()=>{ const t=setTimeout(onClose,2500); return ()=>clearTimeout(t); },[c.id]);
  const R=92;
  return <div onClick={onClose} className="fixed inset-0 z-[70] flex items-center justify-center cursor-pointer select-none"
    style={{background:'radial-gradient(440px 440px at 50% 45%, rgba(245,158,11,.20), rgba(9,9,11,.93) 72%)', animation:'introFade .25s ease-out both'}}>
    <div className="relative flex flex-col items-center" key={c.id}>
      <div className="relative w-60 h-60 flex items-center justify-center">
        {Array.from({length:8},(_,i)=>{ const a=i/8*Math.PI*2-Math.PI/2; const x=Math.cos(a)*R, y=Math.sin(a)*R;
          return <span key={i} className="absolute text-3xl" style={{
            left:`calc(50% + ${x.toFixed(0)}px - 18px)`, top:`calc(50% + ${y.toFixed(0)}px - 18px)`,
            animation:`flamePop .5s cubic-bezier(.34,1.56,.64,1) ${(0.12+i*0.06).toFixed(2)}s both, flameWob 1.1s ease-in-out ${(0.65+i*0.08).toFixed(2)}s infinite`}}>🔥</span>;})}
        <span className="text-8xl" style={{animation:'stickerPop .6s cubic-bezier(.34,1.56,.64,1) both', textShadow:'0 0 60px rgba(245,158,11,.45)'}}>{c.emoji}</span>
      </div>
      <div className="text-3xl font-extrabold text-amber-400 tracking-tight" style={{animation:'riseIn .5s cubic-bezier(.22,1,.36,1) .35s both'}}>🔥 Streak · Tag {c.streak}</div>
      <div className="text-sm text-zinc-400 mt-2" style={{animation:'riseIn .5s cubic-bezier(.22,1,.36,1) .5s both'}}>Weiter so, Miguel! 💪</div>
    </div>
  </div>;
}

/* ---------- Intro: Background Paths (Port der shadcn-Komponente, ohne framer-motion) ---------- */
function FloatingPaths({position}){
  const paths=Array.from({length:18},(_,n)=>{ const i=n*2; return {
    id:i,
    d:`M-${380-i*5*position} -${189+i*6}C-${380-i*5*position} -${189+i*6} -${312-i*5*position} ${216-i*6} ${152-i*5*position} ${343-i*6}C${616-i*5*position} ${470-i*6} ${684-i*5*position} ${875-i*6} ${684-i*5*position} ${875-i*6}`,
    width:0.5+i*0.03,
  };});
  return <div className="absolute inset-0 pointer-events-none">
    <svg className="w-full h-full text-white" viewBox="0 0 696 316" fill="none">
      <title>Background Paths</title>
      {paths.map(p=><path key={p.id} d={p.d} pathLength="1" stroke="currentColor" fill="none"
        strokeWidth={p.width} strokeOpacity={0.1+p.id*0.03} className="fp"
        style={{'--dur':`${20+(p.id%10)}s`, animationDelay:`-${(p.id*0.7).toFixed(1)}s`}}/>)}
    </svg>
  </div>;
}
function Intro({onEnter}){
  const words='Life OS'.split(' ');
  return <div className="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-zinc-950">
    <div className="absolute inset-0">
      <FloatingPaths position={1}/>
      <FloatingPaths position={-1}/>
    </div>
    <div className="relative z-10 text-center px-4">
      <h1 className="rise-in text-6xl sm:text-8xl font-bold mb-10 tracking-tighter text-white" style={{animationDelay:'0.2s'}}>
        {words.map((w,wi)=><span key={wi} className="inline-block mr-5 last:mr-0">
          {w.split('').map((ch,li)=><span key={li} className="letter-fade inline-block" style={{animationDelay:`${(0.35+wi*0.15+li*0.06).toFixed(2)}s`}}>{ch}</span>)}
        </span>)}
      </h1>
      <div className="rise-in inline-block group relative bg-gradient-to-b from-white/10 to-black/10 p-px rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300" style={{animationDelay:'0.9s'}}>
        <button onClick={onEnter}
          className="rounded-[1.15rem] px-8 py-4 text-lg font-semibold bg-zinc-900 hover:bg-zinc-800 text-white transition-all duration-300 group-hover:-translate-y-0.5 border border-white/10 hover:shadow-md">
          <span className="opacity-90 group-hover:opacity-100 transition-opacity">Open Life OS</span>
          <span className="ml-3 inline-block opacity-70 group-hover:opacity-100 group-hover:translate-x-1.5 transition-all duration-300">→</span>
        </button>
      </div>
    </div>
  </div>;
}
function Root(){
  const [entered,setEntered]=useState(false);
  return entered ? <App/> : <Intro onEnter={()=>setEntered(true)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
